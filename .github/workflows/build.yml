name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate project folder
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Star-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
